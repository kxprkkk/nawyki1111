<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nawyki" />
  <meta name="theme-color" content="#060811" />
  <title>Modular Liquid Glass Habits</title>
  
  <!-- Dynamic PWA Manifest -->
  <link id="pwa-manifest" rel="manifest" />
  <link id="apple-touch-icon" rel="apple-touch-icon" />

  <style>
    :root {
      --bg-deep: #060811;
      --glass-bg: rgba(255, 255, 255, 0.065);
      --glass-bg-active: rgba(255, 255, 255, 0.13);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --text-main: #f8fafc;
      --text-muted: rgba(248, 250, 252, 0.58);
      --accent-cyan: #38bdf8;
      --accent-emerald: #34d399;
      --accent-purple: #a855f7;
      --accent-gold: #fbbf24;
      --accent-rose: #fb7185;
      --accent-orange: #fb923c;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, select {
      user-select: auto;
      -webkit-user-select: auto;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding-top: calc(env(safe-area-inset-top, 20px) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 100px);
      padding-left: 16px;
      padding-right: 16px;
      position: relative;
    }

    /* Ambient Blobs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #05070f 75%);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.52;
      animation: floatBlob 18s infinite alternate ease-in-out;
    }

    .blob-1 { width: 300px; height: 300px; background: #0284c7; top: -60px; left: -60px; }
    .blob-2 { width: 280px; height: 280px; background: #4f46e5; top: 32%; right: -80px; animation-delay: -5s; }
    .blob-3 { width: 260px; height: 260px; background: #059669; bottom: 8%; left: -50px; animation-delay: -10s; }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 35px) scale(1.12); }
    }

    .app-container {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 0 var(--glass-highlight), 0 12px 32px -8px rgba(0, 0, 0, 0.45);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.2);
      transition: transform 0.15s ease;
    }

    .icon-btn:active { transform: scale(0.92); }

    .date-title-wrap { display: flex; flex-direction: column; }
    .date-label { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .date-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .today-pill {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--accent-cyan);
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    /* Streak Badge */
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(251, 146, 60, 0.15);
      border: 1px solid rgba(251, 146, 60, 0.4);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-orange);
      box-shadow: 0 0 16px rgba(251, 146, 60, 0.2);
    }

    /* Section container */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.95);
    }

    /* Habits Items Grid & Rows */
    .habits-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .habit-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .habit-card:active { transform: scale(0.98); }

    .habit-card.completed {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(52, 211, 153, 0.06));
      border-color: rgba(52, 211, 153, 0.65);
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.14);
    }

    .habit-card.important {
      border-color: rgba(251, 191, 36, 0.4);
    }

    .habit-card.important.completed {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.24), rgba(52, 211, 153, 0.12));
      border-color: rgba(251, 191, 36, 0.75);
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .habit-icon { font-size: 20px; flex-shrink: 0; }

    .habit-info { display: flex; flex-direction: column; min-width: 0; }
    .habit-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .habit-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; display: flex; align-items: center; gap: 6px; }

    .check-box {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .habit-card.completed .check-box {
      background: var(--accent-emerald);
      border-color: var(--accent-emerald);
      color: #04150e;
      font-weight: 800;
    }

    /* Counter Habit Card */
    .counter-card {
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--glass-border);
    }

    .counter-card.completed {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(52, 211, 153, 0.1));
      border-color: rgba(56, 189, 248, 0.5);
    }

    .counter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .pages-input-wrap {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .pages-input {
      width: 64px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      outline: none;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .pill-btn {
      padding: 7px 4px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .pill-btn:active { background: rgba(255, 255, 255, 0.16); }

    /* Weekly Goal Habit Card */
    .weekly-card {
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--glass-border);
    }

    .weekly-card.completed {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(56, 189, 248, 0.08));
      border-color: rgba(168, 85, 247, 0.6);
    }

    .weekly-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .weekly-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .w-pill {
      flex: 1;
      min-width: 36px;
      height: 34px;
      border-radius: 10px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .w-pill.done {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
      color: #fff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }

    /* Calendar View */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.035);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .cal-day.empty { background: transparent; border-color: transparent; pointer-events: none; }
    .cal-day.selected { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.16); }
    .cal-day.has-data { background: rgba(255, 255, 255, 0.09); }
    .cal-dots { display: flex; gap: 2px; height: 4px; }
    .c-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-emerald); }

    /* Settings & Builder View */
    .btn-primary {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(56, 189, 248, 0.08));
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-secondary {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .builder-section-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 12px;
    }

    .builder-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .text-input, .select-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
      margin-bottom: 8px;
    }

    .small-danger-btn {
      background: rgba(251, 113, 133, 0.15);
      border: 1px solid rgba(251, 113, 133, 0.35);
      color: var(--accent-rose);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Bottom Dock */
    .bottom-dock-wrap {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 50;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.3), 0 16px 40px rgba(0, 0, 0, 0.6);
      border-radius: 999px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .dock-tab {
      padding: 10px 8px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dock-tab.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
    }

    .view-section { display: none; flex-direction: column; gap: 16px; }
    .view-section.active { display: flex; }

    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 20px) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div id="toast" class="toast">Zapisano!</div>

  <div class="app-container">
    <!-- Top Bar -->
    <div class="glass-card top-header">
      <div class="date-nav">
        <button class="icon-btn" id="prevDayBtn">&#8249;</button>
        <div class="date-title-wrap">
          <div class="date-label" id="currentDateLabel">Dzisiaj</div>
          <div class="date-sub" id="currentDateSub"></div>
        </div>
        <button class="icon-btn" id="nextDayBtn">&#8250;</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="today-pill" id="backToTodayBtn">Dzisiaj</button>
        <div class="streak-badge" id="mainStreakBadge">
          <span>🔥</span> <span id="mainStreakNum">0</span>
        </div>
      </div>
    </div>

    <!-- VIEW 1: DZISIAJ -->
    <div id="view-today" class="view-section active">
      <div id="dynamicSectionsContainer"></div>
    </div>

    <!-- VIEW 2: KALENDARZ -->
    <div id="view-calendar" class="view-section">
      <div class="glass-card">
        <div class="section-header">
          <button class="icon-btn" id="prevMonthBtn">&#8249;</button>
          <div class="section-title" id="calMonthLabel">Październik 2026</div>
          <button class="icon-btn" id="nextMonthBtn">&#8250;</button>
        </div>

        <div style="display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:11px; color:var(--text-muted); margin-top:12px; font-weight:600;">
          <div>Pon</div><div>Wt</div><div>Śr</div><div>Czw</div><div>Pt</div><div>Sob</div><div>Nie</div>
        </div>
        <div class="cal-grid" id="calendarGrid"></div>
      </div>
    </div>

    <!-- VIEW 3: ZARZĄDZANIE -->
    <div id="view-settings" class="view-section">
      <div class="glass-card">
        <div class="section-header">
          <div class="section-title">🛠️ Edytor Sekcji i Nawykow</div>
          <div class="section-sub">Dostosuj aplikację</div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:16px;">
          <input type="text" id="newSecNameInput" class="text-input" placeholder="Nazwa nowej sekcji..." style="margin-bottom:0;" />
          <button class="pill-btn" id="addSectionBtn" style="padding:0 14px; flex-shrink:0;">+ Sekcja</button>
        </div>

        <div id="builderSectionsList"></div>
      </div>

      <div class="glass-card">
        <div class="section-header">
          <div class="section-title">☁️ Backup Danych (.JSON)</div>
          <div class="section-sub" id="lastBackupText">Zapisz kopię</div>
        </div>
        <button class="btn-primary" id="exportBackupBtn">⬇️ Pobierz Backup (.json)</button>
        <button class="btn-secondary" id="importBackupBtn">⬆️ Wczytaj Backup z pliku</button>
        <input type="file" id="importFileInput" accept=".json" style="display:none;" />
      </div>
    </div>
  </div>

  <!-- Bottom Dock -->
  <div class="bottom-dock-wrap">
    <div class="bottom-dock">
      <button class="dock-tab active" data-view="today">🔥 Dzisiaj</button>
      <button class="dock-tab" data-view="calendar">📅 Kalendarz</button>
      <button class="dock-tab" data-view="settings">⚙️ Zarządzaj</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'modular_liquid_habits_v3';

    const DEFAULT_DATA = {
      sections: [
        {
          id: 'sec_fitness',
          title: '⚡ Fitness & Ruch',
          habits: [
            { id: 'hab_gym', name: 'Siłownia', type: 'weekly', target: 3, icon: '🏋️‍♂️', important: false },
            { id: 'hab_stretch', name: 'Rozciąganie', type: 'daily', icon: '🧘‍♂️', important: false }
          ]
        },
        {
          id: 'sec_health',
          title: '💊 Suplementy & Zdrowie',
          habits: [
            { id: 'hab_d3', name: 'Witamina D3', type: 'daily', icon: '☀️', important: true },
            { id: 'hab_mag', name: 'Magnez', type: 'daily', icon: '💊', important: true },
            { id: 'hab_cynk', name: 'Cynk', type: 'daily', icon: '🛡️', important: false },
            { id: 'hab_boron', name: 'Boron', type: 'daily', icon: '🌿', important: false },
            { id: 'hab_selen', name: 'Selen', type: 'daily', icon: '🧬', important: false },
            { id: 'hab_ashwa', name: 'Ashwagandha', type: 'daily', icon: '🌙', important: false },
            { id: 'hab_nac', name: 'NAC', type: 'daily', icon: '🧪', important: false }
          ]
        },
        {
          id: 'sec_dev',
          title: '📚 Rozwój & Dom',
          habits: [
            { id: 'hab_book', name: 'Czytanie książek', type: 'counter', unit: 'str.', dailyGoal: 15, icon: '📖', important: false },
            { id: 'hab_clean', name: 'Sprzątanie (Maintenance)', type: 'daily', icon: '✨', important: false }
          ]
        }
      ],
      days: {},
      weeklyLogs: {},
      lastBackup: null
    };

    let state = JSON.parse(JSON.stringify(DEFAULT_DATA));

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getWeekKey(dateObj) {
      const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    const todayKey = formatDateKey(new Date());
    let selectedDateKey = todayKey;
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.sections) state = parsed;
        }
      } catch (e) { console.error(e); }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getDayData(dateKey) {
      if (!state.days[dateKey]) {
        state.days[dateKey] = { completed: {}, counters: {} };
      }
      return state.days[dateKey];
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function calculateMainStreak() {
      let streak = 0;
      let d = new Date();
      while (true) {
        const key = formatDateKey(d);
        const dayData = state.days[key];
        const importantHabits = [];
        state.sections.forEach(sec => {
          sec.habits.forEach(h => {
            if (h.important && h.type === 'daily') importantHabits.push(h.id);
          });
        });

        if (importantHabits.length === 0) break;
        const allDone = importantHabits.every(id => dayData && dayData.completed && dayData.completed[id]);
        if (allDone) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          if (key === todayKey) {
            d.setDate(d.getDate() - 1);
            const yKey = formatDateKey(d);
            const yData = state.days[yKey];
            if (!yData || !importantHabits.every(id => yData.completed && yData.completed[id])) {
              break;
            }
          } else {
            break;
          }
        }
      }
      return streak;
    }

    function renderHeader() {
      const [y, m, d] = selectedDateKey.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const plDays = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
      const plMonths = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];

      const labelEl = document.getElementById('currentDateLabel');
      const subEl = document.getElementById('currentDateSub');
      const todayBtn = document.getElementById('backToTodayBtn');

      if (selectedDateKey === todayKey) {
        labelEl.textContent = 'Dzisiaj';
        todayBtn.style.display = 'none';
      } else {
        labelEl.textContent = `${d} ${plMonths[m - 1]} ${y}`;
        todayBtn.style.display = 'inline-block';
      }
      subEl.textContent = `${plDays[dateObj.getDay()]}, ${d}.${String(m).padStart(2, '0')}.${y}`;
      document.getElementById('mainStreakNum').textContent = calculateMainStreak();
    }

    function renderTodayView() {
      renderHeader();
      const container = document.getElementById('dynamicSectionsContainer');
      container.innerHTML = '';

      const dayData = getDayData(selectedDateKey);
      const [y, m, d] = selectedDateKey.split('-').map(Number);
      const currentWeekKey = getWeekKey(new Date(y, m - 1, d));

      if (!state.weeklyLogs[currentWeekKey]) {
        state.weeklyLogs[currentWeekKey] = {};
      }

      state.sections.forEach(sec => {
        const secCard = document.createElement('div');
        secCard.className = 'glass-card section-block';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'section-header';
        headerDiv.innerHTML = `<div class="section-title">${sec.title}</div><div style="font-size:11px; color:var(--text-muted);">${sec.habits.length} nawyków</div>`;
        secCard.appendChild(headerDiv);

        const stackDiv = document.createElement('div');
        stackDiv.className = 'habits-stack';

        sec.habits.forEach(habit => {
          if (habit.type === 'daily') {
            const isDone = !!(dayData.completed && dayData.completed[habit.id]);
            const item = document.createElement('div');
            item.className = `habit-card ${habit.important ? 'important' : ''} ${isDone ? 'completed' : ''}`;
            item.innerHTML = `
              <div class="habit-left">
                <span class="habit-icon">${habit.icon || '📌'}</span>
                <div class="habit-info">
                  <div class="habit-name">${habit.name}</div>
                  <div class="habit-sub">${habit.important ? '★ Ważny nawyk' : 'Codzienny'}</div>
                </div>
              </div>
              <div class="check-box">${isDone ? '✓' : ''}</div>
            `;
            item.addEventListener('click', () => {
              if (!dayData.completed) dayData.completed = {};
              dayData.completed[habit.id] = !isDone;
              saveState();
              renderTodayView();
            });
            stackDiv.appendChild(item);

          } else if (habit.type === 'counter') {
            const val = (dayData.counters && dayData.counters[habit.id]) || 0;
            const goal = habit.dailyGoal || 10;
            const isDone = val >= goal;

            const card = document.createElement('div');
            card.className = `counter-card ${isDone ? 'completed' : ''}`;
            card.innerHTML = `
              <div class="counter-top">
                <div class="habit-left">
                  <span class="habit-icon">${habit.icon || '📖'}</span>
                  <div class="habit-info">
                    <div class="habit-name">${habit.name}</div>
                    <div class="habit-sub">Cel: ${goal} ${habit.unit || 'jedn.'}</div>
                  </div>
                </div>
                <div class="pages-input-wrap">
                  <input type="number" min="0" class="pages-input" value="${val}" data-habitid="${habit.id}" />
                  <span style="font-size:11px; color:var(--text-muted);">${habit.unit || ''}</span>
                </div>
              </div>
              <div class="quick-btns">
                <button class="pill-btn" data-delta="-5">-5</button>
                <button class="pill-btn" data-delta="5">+5</button>
                <button class="pill-btn" data-delta="10">+10</button>
                <button class="pill-btn" data-delta="20">+20</button>
              </div>
            `;

            const inputEl = card.querySelector('.pages-input');
            inputEl.addEventListener('input', (e) => {
              if (!dayData.counters) dayData.counters = {};
              dayData.counters[habit.id] = Math.max(0, parseInt(e.target.value, 10) || 0);
              saveState();
              renderTodayView();
            });

            card.querySelectorAll('.pill-btn').forEach(b => {
              b.addEventListener('click', () => {
                const delta = parseInt(b.dataset.delta, 10);
                if (!dayData.counters) dayData.counters = {};
                const current = dayData.counters[habit.id] || 0;
                dayData.counters[habit.id] = Math.max(0, current + delta);
                saveState();
                renderTodayView();
              });
            });

            stackDiv.appendChild(card);

          } else if (habit.type === 'weekly') {
            const target = habit.target || 3;
            if (!state.weeklyLogs[currentWeekKey][habit.id]) {
              state.weeklyLogs[currentWeekKey][habit.id] = [];
            }
            const loggedDates = state.weeklyLogs[currentWeekKey][habit.id];
            const isCompletedThisWeek = loggedDates.length >= target;

            const card = document.createElement('div');
            card.className = `weekly-card ${isCompletedThisWeek ? 'completed' : ''}`;
            
            let pillsHtml = '';
            for (let i = 1; i <= target; i++) {
              const done = i <= loggedDates.length;
              pillsHtml += `<div class="w-pill ${done ? 'done' : ''}">${done ? '✓' : i}</div>`;
            }

            card.innerHTML = `
              <div class="weekly-top">
                <div class="habit-left">
                  <span class="habit-icon">${habit.icon || '🏋️‍♂️'}</span>
                  <div class="habit-info">
                    <div class="habit-name">${habit.name}</div>
                    <div class="habit-sub">Cel: ${target}x w tygodniu (${loggedDates.length}/${target})</div>
                  </div>
                </div>
                <button class="pill-btn" style="padding:6px 12px;" id="toggleWeek_${habit.id}">${loggedDates.includes(selectedDateKey) ? 'Cofnij dzisiaj' : '+ Zaliczenia'}</button>
              </div>
              <div class="weekly-pills">${pillsHtml}</div>
            `;

            card.querySelector(`#toggleWeek_${habit.id}`).addEventListener('click', () => {
              const arr = state.weeklyLogs[currentWeekKey][habit.id];
              const idx = arr.indexOf(selectedDateKey);
              if (idx === -1) {
                arr.push(selectedDateKey);
              } else {
                arr.splice(idx, 1);
              }
              saveState();
              renderTodayView();
            });

            stackDiv.appendChild(card);
          }
        });

        secCard.appendChild(stackDiv);
        container.appendChild(secCard);
      });
    }

    function renderCalendarView() {
      const plMonthsFull = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
      document.getElementById('calMonthLabel').textContent = `${plMonthsFull[calMonth]} ${calYear}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(calYear, calMonth, 1);
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      let startWeekday = (firstDay.getDay() + 6) % 7;

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const data = state.days[key];
        const cell = document.createElement('div');
        const hasData = data && ((data.completed && Object.keys(data.completed).length > 0) || (data.counters && Object.keys(data.counters).length > 0));

        cell.className = `cal-day ${hasData ? 'has-data' : ''} ${key === selectedDateKey ? 'selected' : ''}`;
        cell.innerHTML = `<span>${d}</span><div class="cal-dots">${hasData ? '<span class="c-dot"></span>' : ''}</div>`;

        cell.addEventListener('click', () => {
          selectedDateKey = key;
          renderTodayView();
          renderCalendarView();
          switchView('today');
          showToast(`Wybrano: ${d}.${String(calMonth + 1).padStart(2, '0')}`);
        });

        grid.appendChild(cell);
      }
    }

    function renderSettingsView() {
      const list = document.getElementById('builderSectionsList');
      list.innerHTML = '';

      state.sections.forEach((sec, sIdx) => {
        const box = document.createElement('div');
        box.className = 'builder-section-box';

        let habitsHtml = '';
        sec.habits.forEach((h, hIdx) => {
          habitsHtml += `
            <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.03); padding:8px 10px; border-radius:8px; margin-bottom:6px; font-size:13px;">
              <span>${h.icon || '📌'} <b>${h.name}</b> <span style="color:var(--text-muted); font-size:11px;">(${h.type})</span></span>
              <button class="small-danger-btn" onclick="deleteHabit('${sec.id}', '${h.id}')">Usuń</button>
            </div>
          `;
        });

        box.innerHTML = `
          <div class="builder-header-row">
            <b style="font-size:14px;">${sec.title}</b>
            <button class="small-danger-btn" onclick="deleteSection('${sec.id}')">Usuń sekcję</button>
          </div>
          <div style="margin-bottom:8px;">${habitsHtml}</div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <input type="text" id="newHabitName_${sec.id}" class="text-input" placeholder="Nowy nawyk..." style="margin-bottom:0;" />
            <select id="newHabitType_${sec.id}" class="select-input" style="width:110px; margin-bottom:0;">
              <option value="daily">Codzienny</option>
              <option value="counter">Licznik</option>
              <option value="weekly">Tygodniowy</option>
            </select>
            <button class="pill-btn" onclick="addHabitToSection('${sec.id}')" style="padding:0 12px;">+</button>
          </div>
        `;
        list.appendChild(box);
      });
    }

    window.deleteSection = function(secId) {
      state.sections = state.sections.filter(s => s.id !== secId);
      saveState();
      renderSettingsView();
      renderTodayView();
      showToast('Usunięto sekcję');
    };

    window.deleteHabit = function(secId, habitId) {
      const sec = state.sections.find(s => s.id === secId);
      if (sec) {
        sec.habits = sec.habits.filter(h => h.id !== habitId);
        saveState();
        renderSettingsView();
        renderTodayView();
        showToast('Usunięto nawyk');
      }
    };

    window.addHabitToSection = function(secId) {
      const nameInput = document.getElementById(`newHabitName_${secId}`);
      const typeSelect = document.getElementById(`newHabitType_${secId}`);
      const name = nameInput.value.trim();
      if (!name) return;

      const sec = state.sections.find(s => s.id === secId);
      if (sec) {
        sec.habits.push({
          id: 'hab_' + Date.now(),
          name,
          type: typeSelect.value,
          target: typeSelect.value === 'weekly' ? 3 : undefined,
          dailyGoal: typeSelect.value === 'counter' ? 15 : undefined,
          unit: typeSelect.value === 'counter' ? 'str.' : undefined,
          icon: '✨',
          important: false
        });
        nameInput.value = '';
        saveState();
        renderSettingsView();
        renderTodayView();
        showToast('Dodano nawyk!');
      }
    };

    document.getElementById('addSectionBtn').addEventListener('click', () => {
      const inp = document.getElementById('newSecNameInput');
      const title = inp.value.trim();
      if (!title) return;
      state.sections.push({
        id: 'sec_' + Date.now(),
        title,
        habits: []
      });
      inp.value = '';
      saveState();
      renderSettingsView();
      renderTodayView();
      showToast('Dodano sekcję!');
    });

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.getElementById(`view-${viewName}`).classList.add('active');
      document.querySelectorAll('.dock-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.view === viewName);
      });
      if (viewName === 'settings') renderSettingsView();
      if (viewName === 'calendar') renderCalendarView();
    }

    document.querySelectorAll('.dock-tab').forEach(tab => {
      tab.addEventListener('click', () => switchView(tab.dataset.view));
    });

    document.getElementById('prevDayBtn').addEventListener('click', () => {
      const [y, m, d] = selectedDateKey.split('-').map(Number);
      const prev = new Date(y, m - 1, d - 1);
      selectedDateKey = formatDateKey(prev);
      renderTodayView();
    });

    document.getElementById('nextDayBtn').addEventListener('click', () => {
      const [y, m, d] = selectedDateKey.split('-').map(Number);
      const next = new Date(y, m - 1, d + 1);
      selectedDateKey = formatDateKey(next);
      renderTodayView();
    });

    document.getElementById('backToTodayBtn').addEventListener('click', () => {
      selectedDateKey = todayKey;
      renderTodayView();
    });

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendarView();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendarView();
    });

    document.getElementById('exportBackupBtn').addEventListener('click', () => {
      const nowStr = formatDateKey(new Date());
      state.lastBackup = nowStr;
      saveState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nawyki-backup-${nowStr}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Pobrano backup!');
    });

    document.getElementById('importBackupBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && parsed.sections) {
            state = parsed;
            saveState();
            renderTodayView();
            renderCalendarView();
            showToast('Wczytano backup!');
          }
        } catch(err) { showToast('Błąd pliku'); }
      };
      reader.readAsText(file);
    });

    // PWA Manifest & Service Worker Setup (Offline Support)
    function setupPWA() {
      // 1. Generate Manifest Data URI
      const manifestData = {
        name: "Liquid Glass Habits",
        short_name: "Nawyki",
        start_url: "./",
        display: "standalone",
        background_color: "#060811",
        theme_color: "#060811",
        icons: []
      };
      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);

      // 2. Generate Apple Touch Icon
      const canvas = document.createElement('canvas');
      canvas.width = 180; canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#060811'; ctx.fillRect(0, 0, 180, 180);
      ctx.fillStyle = '#fb923c'; ctx.font = 'bold 90px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🔥', 90, 90);
      document.getElementById('apple-touch-icon').href = canvas.toDataURL();

      // 3. Register Service Worker for Offline Cache
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error:', err));
      }
    }

    loadState();
    setupPWA();
    renderTodayView();
  </script>
</body>
</html>
